name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # permite rodar pela aba Actions

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, formatação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: Testes de ponta a ponta (PDF real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
